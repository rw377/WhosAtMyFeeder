name: Who's At My Feeder - Fork
version: "2.3.2"
slug: whosatmyfeeder
description: Identifies the bird species Frigate or Blue Iris detects, with searchable history, stats and MQTT alerts.
url: https://github.com/rw377/WhosAtMyFeeder
arch:
  - amd64
  - aarch64
init: false
startup: application
ingress: true
ingress_port: 7766
panel_icon: mdi:bird
panel_title: Feeder
hassio_api: true
services:
  - mqtt:want
ports:
  7766/tcp: null
ports_description:
  7766/tcp: Direct web UI access (optional; the sidebar panel works without it)
options:
  source: frigate
  cameras:
    - BirdFeeder
  threshold: 0.7
  bi_topic: BlueIris/+/alert
  frigate_url: http://ccab4aaf-frigate:5000
  frigate_topic: frigate
schema:
  source: list(frigate|blueiris)
  cameras:
    - str
  threshold: float(0.1,0.99)
  bi_url: url?
  bi_username: str?
  bi_password: password?
  bi_topic: str?
  frigate_url: url?
  frigate_topic: str?
  mqtt_server: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
