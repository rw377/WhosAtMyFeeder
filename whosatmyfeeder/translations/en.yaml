configuration:
  source:
    name: Event source
    description: >-
      Where bird events come from: frigate, or blueiris (Blue Iris alerts
      confirmed by CodeProject.AI, sent over MQTT). Options marked [Blue Iris]
      are only used with blueiris, and options marked [Frigate] only with
      frigate. See the Documentation tab for setup.
  cameras:
    name: Cameras
    description: >-
      Camera names to watch, spelled exactly (case-sensitive). Blue Iris: the
      camera short name, e.g. BirdFeeder. Frigate: the camera name in Frigate's
      config. Can also be set in the app under Settings → Cameras, which
      overrides this.
  threshold:
    name: Detection threshold
    description: >-
      Minimum classifier confidence (0.1–0.99) to record a detection. Can be
      changed in the app under Settings → Detection & thresholds.
  bi_url:
    name: "[Blue Iris] Server URL"
    description: Blue Iris web server, e.g. http://192.168.1.20:81. Required with blueiris.
  bi_username:
    name: "[Blue Iris] Username"
    description: >-
      A Blue Iris user (as for UI3) that can view the bird camera. Leave empty
      if Blue Iris needs no login from this host.
  bi_password:
    name: "[Blue Iris] Password"
    description: Password for that Blue Iris user.
  bi_topic:
    name: "[Blue Iris] MQTT topic"
    description: Topic the Blue Iris alert action publishes to. Default BlueIris/+/alert.
  frigate_url:
    name: "[Frigate] API URL"
    description: >-
      Where Frigate's API is; required with frigate. For the Frigate add-on this
      is usually http://ccab4aaf-frigate:5000. With blueiris it's only used to
      show or copy pictures of old Frigate detections; clear it once Frigate is gone.
  frigate_topic:
    name: "[Frigate] MQTT topic"
    description: Frigate's MQTT topic prefix (usually "frigate"). Not used with blueiris.
  mqtt_server:
    name: MQTT server
    description: >-
      The broker that bird events arrive on and alerts are sent to. Leave empty
      to use the Mosquitto broker add-on automatically.
  mqtt_port:
    name: MQTT port
    description: Leave empty for 1883.
  mqtt_username:
    name: MQTT username
    description: Leave empty when using the Mosquitto broker add-on.
  mqtt_password:
    name: MQTT password
    description: Leave empty when using the Mosquitto broker add-on.
